        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: #000;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .profile-card {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
            animation: fadeIn 0.8s ease-in-out;
            margin: auto;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #0ff;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .username {
            margin: 0;
            font-size: 1.6rem;
            text-shadow: 0 0 8px #0ff;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 0.88rem;
            color: #ccc;
            margin: 15px 0 25px 0;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .link-btn .btn-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-btn svg {
            width: 20px;
            height: 20px;
            fill: #0ff;
            transition: fill 0.3s ease;
        }

        .link-btn .subtext {
            font-size: 0.75rem;
            color: #888;
            font-weight: normal;
        }

        .link-btn:hover {
            background: rgba(0, 255, 255, 0.12);
            border-color: #0ff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .link-btn:hover .subtext {
            color: #0ff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById("bg-canvas"),
            ctx = canvas.getContext("2d");

        let particles = [];

        const MAX = window.innerWidth < 600 ? 25 : 50;
        const DIST = 100;
        const COLORS = ['#0ff', '#ff0', '#f0f', '#0f0'];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < MAX; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.vx = (Math.random() - .5) * 1.2;
                this.vy = (Math.random() - .5) * 1.2;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let d = Math.sqrt(dx * dx + dy * dy);

                    if (d < DIST) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0,255,255,${0.5-d/(2*DIST)})`;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connect();
            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", init);

        init();
        animate();
    </script>
